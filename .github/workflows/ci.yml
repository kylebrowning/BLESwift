name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Strict build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings as errors)
        run: BLESWIFT_STRICT=1 swift build
      - name: Test
        run: BLESWIFT_STRICT=1 swift test
      - name: Consumer simulation (issue #20 regression guard)
        # Xcode compiles package dependencies with -suppress-warnings, which
        # hard-conflicts with -warnings-as-errors. This step fails if strict
        # warnings ever leak back into the default (consumer-facing) settings.
        run: swift build -Xswiftc -suppress-warnings

  ios-simulator-test:
    # The connection-event and ANCS suites are fenced (#if !os(macOS) / #if os(iOS)),
    # so `swift test` on the macOS host skips them. Run the full suite on an iOS
    # simulator so those tests — and the connection-event subscriber-refcount
    # concurrency code they cover — actually execute.
    name: Test (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Named devices drift with the runner image's Xcode: `iPhone 16` is gone from the
      # current one (`iPhone 16e` and `iPhone 17` are what it ships), and a destination that
      # matches nothing fails the job outright.
      - name: Test on iOS Simulator
        run: xcodebuild test -scheme BLESwift-Package -destination 'platform=iOS Simulator,name=iPhone 17'

  platform-build:
    # The manifest declares watchOS/tvOS/visionOS; the peripheral role's CoreBluetooth
    # APIs are unavailable there and must stay fenced out (issue #22 regression guard).
    name: Build (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [watchOS, tvOS, visionOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build BLESwift
        run: xcodebuild build -scheme BLESwift -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftProfiles
        run: xcodebuild build -scheme BLESwiftProfiles -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftTestSupport
        run: xcodebuild build -scheme BLESwiftTestSupport -destination 'generic/platform=${{ matrix.platform }}'
      # The link and its simulator-side backends are declared for every platform too, and
      # nothing else in CI compiles them off macOS.
      - name: Build BLESwiftLink
        run: xcodebuild build -scheme BLESwiftLink -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftSimulatorLink
        run: xcodebuild build -scheme BLESwiftSimulatorLink -destination 'generic/platform=${{ matrix.platform }}'

  sample-app:
    # Build (only) the BLESwiftExplorer SwiftUI sample for iOS and macOS on every commit,
    # so it stays compiling against the package. It depends on the package by path and
    # ships a committed .xcodeproj (via a .gitignore negation), so CI needs no xcodegen.
    name: Build sample app (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build BLESwiftExplorer
        run: >
          xcodebuild build
          -project Examples/BLESwiftExplorer/BLESwiftExplorer.xcodeproj
          -scheme BLESwiftExplorer
          -destination 'generic/platform=${{ matrix.platform }}'
          -skipPackagePluginValidation -skipMacroValidation

  sim-to-sim-e2e:
    # Two simulator apps talk BLE to each other through bleswift-provider's virtual radio,
    # driven by grantiva. No hardware, no entitlements.
    name: Sim-to-sim E2E (grantiva)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install grantiva
        run: brew install grantiva/tap/grantiva
      - name: Run
        # Both exist on the runner image, so `ensure_simulator` finds them instead of
        # paying to create one.
        run: ADVERTISER_SIM="iPhone 17" SCANNER_SIM="iPhone 16e" Scripts/sim-to-sim-e2e.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-sim-e2e
          path: .build/e2e-report
