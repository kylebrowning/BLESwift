name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job runs on the project's self-hosted macOS runner (labels below). GitHub's hosted
# macOS runners boot simulators in 100-600 s and starve the test process about one push in
# four; a Mac on a desk does neither. A single runner executes one job at a time, so the
# jobs in a run are effectively serial; a newer pull-request run on the same ref cancels
# the older one, and pushes to main queue (see `concurrency` below).
#
# The repository is public. A pull request from a fork falls back to GitHub's hosted image
# in `runs-on` below — but that expression lives in this file, and a `pull_request` run uses
# the workflow file FROM THE PR HEAD, so a fork can rewrite it. The expression is therefore a
# convenience, not the boundary. The boundary is the repository's fork-PR approval policy
# ("all external contributors"): nothing from a fork runs until a maintainer approves it, and
# that approval MUST include reading the PR's `.github/workflows` diff — a fork PR that touches
# a workflow file is not approved, it is rewritten by the maintainer on a same-repo branch.
# Runner groups with pinned workflows would enforce this mechanically; they are an
# organization feature and this is a personal repository.
# A superseded pull-request run is cancelled; pushes to main queue, so every commit on main
# keeps a CI verdict even when two merges land within one serialized run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Strict build & test (macOS)
    timeout-minutes: 20
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","bleswift"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings as errors)
        run: BLESWIFT_STRICT=1 swift build
      - name: Test
        run: BLESWIFT_STRICT=1 swift test
      - name: Test under Thread Sanitizer with the iOS 16 executor
        # BLESwiftCompat16's SerialQueueExecutor and assumeIsolated(onQueue:) are hand-written
        # isolation; a bug there is a data race, which TSan reports deterministically where
        # the plain run would only flake. Non-strict: sanitizer builds emit their own warnings.
        run: BLESWIFT_FORCE_COMPAT16_EXECUTOR=1 swift test --sanitize=thread
      - name: Test on the Swift 6.3 release toolchain
        # The self-hosted Mac runs a beta Xcode, which has hidden Swift 6.3 release-toolchain
        # failures before (an `Xcode 27 beta` build passed where consumers on 6.3.3 failed).
        # The release toolchain installed on the runner is the canary for that, and its
        # absence on the self-hosted runner is a failure, not a skip: a canary that goes
        # green when it is uninstalled is not one. Only GitHub's hosted image — the fork-PR
        # fallback, which has no such toolchain — may skip it.
        #
        # It builds against the macOS 26 SDK, not the beta Xcode's: a 6.3 consumer has a 26-era
        # SDK, and the macOS 27 SDK's interfaces carry flags only Swift 6.4 parses (6.3.3
        # rejects `-target-arch-variant` and crashes rebuilding Foundation). The Command Line
        # Tools keep that SDK; `MacOSX26.sdk` follows its newest 26.x. Missing is a failure too.
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          SDK_26: /Library/Developer/CommandLineTools/SDKs/MacOSX26.sdk
        run: |
          if xcrun --toolchain org.swift.633202606251a swift --version >/dev/null 2>&1; then
            if [ ! -d "$SDK_26" ]; then
              echo "::error::macOS 26 SDK ($SDK_26) is not installed on this runner"
              exit 1
            fi
            SDKROOT="$SDK_26" TOOLCHAINS=org.swift.633202606251a swift test --scratch-path .build-6.3
          elif [ "$HOSTED" = "true" ]; then
            echo "::warning::hosted runner has no Swift 6.3.3 toolchain; canary skipped"
          else
            echo "::error::Swift 6.3.3 release toolchain (org.swift.633202606251a) is not installed on this runner"
            exit 1
          fi
      - name: Consumer simulation (issue #20 regression guard)
        # Xcode compiles package dependencies with -suppress-warnings, which
        # hard-conflicts with -warnings-as-errors. This step fails if strict
        # warnings ever leak back into the default (consumer-facing) settings.
        run: swift build -Xswiftc -suppress-warnings

  ios-simulator-test:
    # The connection-event and ANCS suites are fenced (#if !os(macOS) / #if os(iOS)),
    # so `swift test` on the macOS host skips them. Run the full suite on iOS simulators so
    # those tests — and the connection-event subscriber-refcount concurrency code they
    # cover — actually execute. Three cells:
    #   newest runtime, default executor  — the modern (18-tier) path;
    #   newest runtime, forced 16-tier executor — BLESwiftCompat16's SerialQueueExecutor
    #     and assumeIsolated(onQueue:) under the whole suite;
    #   iOS 17 runtime — the only real Swift 5.9-runtime execution (iOS 16 simulators
    #     cannot run on macOS 27, so the 16 tier is compile-verified by platform-build).
    name: Test (iOS Simulator, ${{ matrix.label }})
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","bleswift"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One simulator per cell, never shared (#48). One runner serialises the cells today, but
      # a second `bleswift` runner on the same Mac would run two at once, and two cells on one
      # device would boot, install into and shut down the same UDID under each other.
      matrix:
        include:
          - { label: "newest runtime",                  sim: "BLESwift CI Test",          major: "",   compat16: "0" }
          - { label: "newest runtime, iOS 16 executor", sim: "BLESwift CI Test Compat16", major: "",   compat16: "1" }
          - { label: "iOS 17 runtime",                  sim: "BLESwift CI Test iOS17",    major: "17", compat16: "0" }
    steps:
      - uses: actions/checkout@v4
      # A CI-only device, by UDID. The runner is also someone's workstation, so the job must
      # not borrow "the newest iPhone" — that is the device they are debugging on. The script
      # reuses a device of this name when it is on the highest-version runtime of the requested
      # major (or overall), and otherwise recreates it on that runtime; nothing is pinned.
      - name: Resolve the CI simulator
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if SIM_UDID=$(Scripts/ci/ensure-ci-simulator.sh "${{ matrix.sim }}" "${{ matrix.major }}"); then
            echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
            xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(*[f\"Using {x['name']} ({r}) {x['udid']}\" for r in d for x in d[r] if x['udid']==sys.argv[1]])" "$SIM_UDID"
          elif [ "$HOSTED" = "true" ] && [ -n "${{ matrix.major }}" ]; then
            echo "::warning::hosted runner has no iOS ${{ matrix.major }} runtime; cell skipped"
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            exit 1
          fi
      - name: Test on iOS Simulator
        if: env.SKIP != '1'
        # Retried once. On GitHub's hosted runners the simulator starved the test process
        # outright (the macOS-green `BLESwiftTests` suite froze for ~100 s inside the
        # simulator until the job timed out). The self-hosted Mac has not shown it; the retry
        # stays for the hosted fallback that fork PRs still use.
        #
        # A green run must also show the executor this cell asked for (#47). If the
        # `TEST_RUNNER_` variable stopped reaching the test process, the forced cell would test
        # the default executor and still pass, and nothing inside the process can tell, since
        # it reads the same missing variable. `ExecutorSelectionTests` prints the executor a
        # `Central` really bound; that line is checked here, from outside. The value sits in
        # brackets and the match is unanchored: the test's logger writes to the same pipe, and a
        # log line can land around the marker (`…poweredOBLESwift executor: defaultn`).
        env:
          TEST_RUNNER_BLESWIFT_FORCE_COMPAT16_EXECUTOR: ${{ matrix.compat16 }}
          EXPECTED_EXECUTOR: ${{ matrix.compat16 == '1' && 'compat16' || 'default' }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/xcodebuild-test.log"
          for attempt in 1 2; do
            if xcodebuild test -scheme BLESwift-Package -destination "platform=iOS Simulator,id=$SIM_UDID" 2>&1 | tee "$log"; then
              if grep -qF "BLESwift executor: [$EXPECTED_EXECUTOR]" "$log"; then
                exit 0
              fi
              echo "::error::tests passed, but not on the $EXPECTED_EXECUTOR executor: $(grep -o 'BLESwift executor: \[[a-z0-9]*\]' "$log" || echo 'no executor line')"
              exit 1
            fi
            echo "attempt $attempt failed"
          done
          exit 1
      - name: Shut the CI simulator down
        # Runs on cancellation too: a cancelled `xcodebuild test` leaves the device booted
        # with a half-torn-down session on a persistent runner.
        if: always()
        run: |
          [ -n "$SIM_UDID" ] && xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true

  platform-build:
    # The manifest declares watchOS/tvOS/visionOS; the peripheral role's CoreBluetooth
    # APIs are unavailable there and must stay fenced out (issue #22 regression guard).
    name: Build (${{ matrix.platform }})
    timeout-minutes: 20
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","bleswift"]') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [watchOS, tvOS, visionOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build BLESwift
        run: xcodebuild build -scheme BLESwift -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftProfiles
        run: xcodebuild build -scheme BLESwiftProfiles -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftTestSupport
        run: xcodebuild build -scheme BLESwiftTestSupport -destination 'generic/platform=${{ matrix.platform }}'
      # The link and its simulator-side backends are declared for every platform too, and
      # nothing else in CI compiles them off macOS.
      - name: Build BLESwiftLink
        run: xcodebuild build -scheme BLESwiftLink -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftSimulatorLink
        run: xcodebuild build -scheme BLESwiftSimulatorLink -destination 'generic/platform=${{ matrix.platform }}'

  sample-app:
    # Build (only) the BLESwiftExplorer SwiftUI sample for iOS and macOS on every commit,
    # so it stays compiling against the package. It depends on the package by path and
    # ships a committed .xcodeproj (via a .gitignore negation), so CI needs no xcodegen.
    name: Build sample app (${{ matrix.platform }})
    timeout-minutes: 20
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","bleswift"]') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build BLESwiftExplorer
        run: >
          xcodebuild build
          -project Examples/BLESwiftExplorer/BLESwiftExplorer.xcodeproj
          -scheme BLESwiftExplorer
          -destination 'generic/platform=${{ matrix.platform }}'
          -skipPackagePluginValidation -skipMacroValidation
