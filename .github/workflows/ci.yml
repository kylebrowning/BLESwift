name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job runs on the project's self-hosted macOS runner (see the labels below). GitHub-hosted
# macOS runners need 100-600 s to boot a simulator and starve the test process in about one push out
# of four. A Mac on a desk does neither. A single runner executes one job at a time, so the jobs in
# a run are almost serial. A newer pull-request run on the same ref cancels the older run. Pushes to
# main wait in a queue (see `concurrency` below).
#
# The repository is public. A pull request from a fork uses the GitHub-hosted image, which the
# `runs-on` expression below selects. That expression is a convenience, not a security boundary: a
# `pull_request` run uses the workflow file FROM THE PR HEAD, so a fork can change it.
#
# The boundary is the repository's fork-PR approval policy ("all external contributors"). Nothing
# from a fork runs until a maintainer approves it. The approval MUST include a read of the PR's
# `.github/workflows` diff. If a fork PR changes a workflow file, do not approve it. The maintainer
# rewrites it on a branch in the same repository. Runner groups with pinned workflows would enforce
# this automatically, but they are an organization feature and this is a personal repository.
#
# A pull-request run that a newer run replaces is cancelled. Pushes to main wait in a queue, so
# every commit on main keeps a CI result even when two merges arrive during one serialized run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Strict build & test (macOS)
    timeout-minutes: 20
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","bleswift"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings as errors)
        run: BLESWIFT_STRICT=1 swift build
      - name: Test
        run: BLESWIFT_STRICT=1 swift test
      - name: Test under Thread Sanitizer with the iOS 16 executor
        # The BLESwiftCompat16 executor (`SerialQueueExecutor` and `assumeIsolated(onQueue:)`) is
        # hand-written isolation, and a bug there is a data race. TSan reports a data race every
        # time. The plain run shows it only sometimes. This step is not strict, because sanitizer
        # builds emit their own warnings.
        run: BLESWIFT_FORCE_COMPAT16_EXECUTOR=1 swift test --sanitize=thread
      - name: Test on the Swift 6.3 release toolchain
        # The self-hosted Mac runs a beta Xcode, which has hidden failures of the Swift 6.3 release
        # toolchain: an `Xcode 27 beta` build passed where consumers on 6.3.3 failed. The release
        # toolchain on the runner is the canary for these failures. If it is not installed on the
        # self-hosted runner, the step fails and does not skip, because a canary that passes when it
        # is not installed is not a canary. Only the GitHub-hosted image, the fork-PR fallback, has
        # no such toolchain and may skip the step.
        #
        # The step builds against the macOS 26 SDK, not the beta Xcode's SDK, because a 6.3 consumer
        # has an SDK from the 26 releases. The macOS 27 SDK interfaces have flags that only Swift
        # 6.4 can parse: Swift 6.3.3 rejects `-target-arch-variant` and crashes when it rebuilds
        # Foundation. The Command Line Tools keep the macOS 26 SDK, and `MacOSX26.sdk` points to the
        # newest 26.x SDK. If this SDK is missing, the step also fails.
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          SDK_26: /Library/Developer/CommandLineTools/SDKs/MacOSX26.sdk
        run: |
          if xcrun --toolchain org.swift.633202606251a swift --version >/dev/null 2>&1; then
            if [ ! -d "$SDK_26" ]; then
              echo "::error::macOS 26 SDK ($SDK_26) is not installed on this runner"
              exit 1
            fi
            SDKROOT="$SDK_26" TOOLCHAINS=org.swift.633202606251a swift test --scratch-path .build-6.3
          elif [ "$HOSTED" = "true" ]; then
            echo "::warning::hosted runner has no Swift 6.3.3 toolchain; canary skipped"
          else
            echo "::error::Swift 6.3.3 release toolchain (org.swift.633202606251a) is not installed on this runner"
            exit 1
          fi
      - name: Consumer simulation (issue #20 regression guard)
        # Xcode compiles package dependencies with -suppress-warnings, which conflicts with
        # -warnings-as-errors. This step fails if strict warnings enter the default settings that
        # consumers use.
        run: swift build -Xswiftc -suppress-warnings

  ios-simulator-test:
    # The suites for connection events and ANCS are fenced (#if !os(macOS) / #if os(iOS)), so `swift
    # test` on the macOS host skips them. This job runs the full suite on iOS simulators, so these
    # tests also run. They cover the concurrency code for the connection events' subscriber
    # reference count. The job has three cells:
    #   - Newest runtime, default executor: the modern (18-tier) path.
    #   - Newest runtime, forced 16-tier executor: BLESwiftCompat16's `SerialQueueExecutor` and
    #     `assumeIsolated(onQueue:)` run under the whole suite.
    #   - iOS 17 runtime: the only real run on the Swift 5.9 runtime. iOS 16 simulators cannot run
    #     on macOS 27, so platform-build only compiles the 16 tier.
    name: Test (iOS Simulator, ${{ matrix.label }})
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","bleswift"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Each cell and each runner has its own simulator (#48). Cells never share one. Several
      # `bleswift` runners share one Mac, so two cells, or the same cell for two pull requests, can
      # run at the same time. Two jobs on one device would boot, install into, and shut down the
      # same UDID while the other job uses it. The cell names the device, and the step "Resolve the
      # CI simulator" appends the runner's name.
      matrix:
        include:
          - { label: "newest runtime",                  sim: "BLESwift CI Test",          major: "",   compat16: "0" }
          - { label: "newest runtime, iOS 16 executor", sim: "BLESwift CI Test Compat16", major: "",   compat16: "1" }
          - { label: "iOS 17 runtime",                  sim: "BLESwift CI Test iOS17",    major: "17", compat16: "0" }
    steps:
      - uses: actions/checkout@v4
      # A device only for CI, selected by UDID. The runner is also a person's workstation, so the
      # job must not use "the newest iPhone", which can be the device that the person debugs on. The
      # script reuses a device of this name if it is on the runtime with the highest version of the
      # requested major version (or of all versions). Otherwise it recreates the device on that
      # runtime. Nothing is pinned.
      - name: Resolve the CI simulator
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if SIM_UDID=$(Scripts/ci/ensure-ci-simulator.sh "${{ matrix.sim }} ($RUNNER_NAME)" "${{ matrix.major }}"); then
            echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
            xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(*[f\"Using {x['name']} ({r}) {x['udid']}\" for r in d for x in d[r] if x['udid']==sys.argv[1]])" "$SIM_UDID"
          elif [ "$HOSTED" = "true" ] && [ -n "${{ matrix.major }}" ]; then
            echo "::warning::hosted runner has no iOS ${{ matrix.major }} runtime; cell skipped"
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            exit 1
          fi
      - name: Test on iOS Simulator
        if: env.SKIP != '1'
        # The step retries once. On GitHub-hosted runners the simulator starved the test process
        # completely: the `BLESwiftTests` suite passed on macOS but froze for about 100 s in the
        # simulator until the job timed out. The self-hosted Mac has not shown this problem. The
        # retry stays for the hosted fallback that fork PRs still use.
        #
        # A passing run must also show the executor that this cell requested (#47). If the
        # `TEST_RUNNER_` variable does not reach the test process, the forced cell tests the default
        # executor and still passes, and nothing in the process can detect this because it reads the
        # same missing variable. `ExecutorSelectionTests` prints the executor that a `Central`
        # really bound, and this step checks that line from outside the process. The value is in
        # brackets and the match is not anchored, because the test logger writes to the same pipe. A
        # log line can appear around the marker (`…poweredOBLESwift executor: defaultn`).
        env:
          TEST_RUNNER_BLESWIFT_FORCE_COMPAT16_EXECUTOR: ${{ matrix.compat16 }}
          EXPECTED_EXECUTOR: ${{ matrix.compat16 == '1' && 'compat16' || 'default' }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/xcodebuild-test.log"
          for attempt in 1 2; do
            if xcodebuild test -scheme BLESwift-Package -destination "platform=iOS Simulator,id=$SIM_UDID" 2>&1 | tee "$log"; then
              if grep -qF "BLESwift executor: [$EXPECTED_EXECUTOR]" "$log"; then
                exit 0
              fi
              echo "::error::tests passed, but not on the $EXPECTED_EXECUTOR executor: $(grep -o 'BLESwift executor: \[[a-z0-9]*\]' "$log" || echo 'no executor line')"
              exit 1
            fi
            echo "attempt $attempt failed"
          done
          exit 1
      - name: Shut the CI simulator down
        # This step also runs after a cancellation. A cancelled `xcodebuild test` leaves the device
        # booted with a half-closed session on a persistent runner.
        if: always()
        run: |
          [ -n "$SIM_UDID" ] && xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true

  platform-build:
    # The manifest declares watchOS, tvOS, and visionOS, where the CoreBluetooth peripheral-role
    # APIs are not available. The build must keep them fenced out (issue #22 regression guard).
    name: Build (${{ matrix.platform }})
    timeout-minutes: 20
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","bleswift"]') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [watchOS, tvOS, visionOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build BLESwift
        run: xcodebuild build -scheme BLESwift -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftProfiles
        run: xcodebuild build -scheme BLESwiftProfiles -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftTestSupport
        run: xcodebuild build -scheme BLESwiftTestSupport -destination 'generic/platform=${{ matrix.platform }}'
      # The link, its simulator backends, and the in-process virtual radio are declared for every
      # platform too. No other CI step compiles them outside macOS.
      - name: Build BLESwiftLink
        run: xcodebuild build -scheme BLESwiftLink -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftSimulatorLink
        run: xcodebuild build -scheme BLESwiftSimulatorLink -destination 'generic/platform=${{ matrix.platform }}'
      - name: Build BLESwiftVirtualRadio
        run: xcodebuild build -scheme BLESwiftVirtualRadio -destination 'generic/platform=${{ matrix.platform }}'

  sample-app:
    # Build (only) the BLESwiftExplorer SwiftUI sample for iOS and macOS on every commit, so the
    # sample always compiles against the package, on which it depends by path. It has a committed
    # .xcodeproj (through a .gitignore negation), so CI does not need xcodegen.
    name: Build sample app (${{ matrix.platform }})
    timeout-minutes: 20
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","bleswift"]') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build BLESwiftExplorer
        run: >
          xcodebuild build
          -project Examples/BLESwiftExplorer/BLESwiftExplorer.xcodeproj
          -scheme BLESwiftExplorer
          -destination 'generic/platform=${{ matrix.platform }}'
          -skipPackagePluginValidation -skipMacroValidation
