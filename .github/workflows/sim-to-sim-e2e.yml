name: Sim-to-sim E2E

# Two simulator apps talk BLE to each other through bleswift-provider's virtual radio,
# driven by grantiva. No hardware, no entitlements. Runs on every push to main and every
# same-repository pull request, on the project's self-hosted Mac: it boots two simulators in
# seconds where GitHub's hosted image took 112-577 s and flaked on runner weather. A fork PR
# skips this job — the self-hosted machine is never exposed to a fork, and the hosted image
# cannot run the test reliably. There is no `continue-on-error`: when it is red, it is red.
#
# grantiva is whatever the runner has installed (`brew upgrade grantiva` on the Mac to move
# it); the `grantiva --version` step records which. The script depends on 1.7.0 features
# (`simulator ensure --name`, `run --ready-file`, `run --env`, `simulator teardown --udid
# --force`), so a version older than that is the first thing to check when a run goes red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      advertiser_sim:
        description: 'Simulator name to host the peripheral (empty = resolve from the runner)'
        required: false
        default: ''
      scanner_sim:
        description: 'Simulator name to scan (empty = resolve from the runner)'
        required: false
        default: ''

# Only a pull request's superseded run is cancelled; a push to main queues instead. A
# cancelled run is SIGKILLed after a short grace period — too short for the script's own
# cleanup — which is what the always-run "Reclaim the simulators" step below is for.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sim-to-sim-e2e:
    name: Sim-to-sim E2E (grantiva)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, bleswift]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew on PATH
        # The runner's LaunchAgent does not source a login shell, so grantiva's Homebrew
        # prefix is added explicitly.
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: grantiva version
        run: grantiva --version
      - name: Resolve two simulators
        # Both dispatch inputs given, both are used as-is (they are empty on push and PR).
        # Otherwise the two newest *numbered* iPhone models the runner actually has: names are
        # ranked with a numbered model ("iPhone 17 Pro") above an unnumbered or suffixed one
        # ("iPhone Air", "iPhone 17e"), then by that number, then by name — so a plain
        # alphabetical sort cannot hand back "iPhone Air" as one of the two newest. Pinned
        # names drift with the runner image's Xcode, which is why nothing is pinned here.
        env:
          ADVERTISER_INPUT: ${{ inputs.advertiser_sim }}
          SCANNER_INPUT: ${{ inputs.scanner_sim }}
        run: |
          if [ -n "$ADVERTISER_INPUT" ] && [ -n "$SCANNER_INPUT" ]; then
            if [ "$ADVERTISER_INPUT" = "$SCANNER_INPUT" ]; then
              echo "::error::advertiser_sim and scanner_sim must name two distinct simulators"
              exit 1
            fi
            echo "ADVERTISER_SIM=$ADVERTISER_INPUT" >> "$GITHUB_ENV"
            echo "SCANNER_SIM=$SCANNER_INPUT" >> "$GITHUB_ENV"
            echo "Using $ADVERTISER_INPUT and $SCANNER_INPUT (from the dispatch inputs)"
            exit 0
          fi
          if [ -n "$ADVERTISER_INPUT" ] || [ -n "$SCANNER_INPUT" ]; then
            echo "::error::give both advertiser_sim and scanner_sim, or neither"
            exit 1
          fi
          NAMES=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; names={x['name'] for r in d for x in d[r] if x['name'].startswith('iPhone')}; rank=lambda n: (1, int(n.split()[1]), n) if len(n.split()) > 1 and n.split()[1].isdigit() else (0, 0, n); print('\n'.join(sorted(names, key=rank)[-2:]))")
          # Two *distinct* names are the whole point: the advertiser and the scanner have to
          # boot as separate simulators. One name would silently run both roles on one
          # device, so fail here with something readable instead.
          if [ "$(echo "$NAMES" | grep -c .)" -lt 2 ]; then
            echo "::error::need two distinct iPhone simulator names, found: ${NAMES:-none}"
            exit 1
          fi
          echo "ADVERTISER_SIM=$(echo "$NAMES" | tail -1)" >> "$GITHUB_ENV"
          echo "SCANNER_SIM=$(echo "$NAMES" | head -1)" >> "$GITHUB_ENV"
          echo "Using $NAMES"
      - name: Run
        run: Scripts/sim-to-sim-e2e.sh
      - name: Reclaim the simulators
        # Runs on cancellation too. The script's EXIT trap does this on a normal end, but a
        # cancelled step is killed before the trap finishes, and on a persistent runner a
        # simulator still leased by a dead grantiva run fails the next run's `ensure`.
        if: always()
        run: |
          pkill -f bleswift-provider || true
          pkill -f grantiva-runner || true
          for name in "$ADVERTISER_SIM" "$SCANNER_SIM"; do
            [ -n "$name" ] || continue
            for udid in $(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(' '.join(x['udid'] for r in d for x in d[r] if x['name']==sys.argv[1] and x['state']=='Booted'))" "$name"); do
              grantiva simulator teardown --udid "$udid" --force || true
            done
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-sim-e2e
          path: .build/e2e-report
