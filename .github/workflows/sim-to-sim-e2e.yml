name: Sim-to-sim E2E

# Two simulator apps talk BLE to each other through bleswift-provider's virtual radio,
# driven by grantiva. No hardware, no entitlements. Runs on every push to main and every
# same-repository pull request, on the project's self-hosted Mac: it boots two simulators in
# seconds where GitHub's hosted image took 112-577 s and flaked on runner weather. The job's
# `if:` skips a fork PR, but that condition lives in this file and a `pull_request` run uses
# the PR head's copy of it — see the note at the top of `ci.yml`: the boundary that keeps a
# fork off the machine is the fork-PR approval policy plus a review of the PR's workflow diff
# before approving. There is no `continue-on-error`: when it is red, it is red.
#
# grantiva is whatever the runner has installed (`brew upgrade grantiva` on the Mac to move
# it); the `grantiva --version` step records which. The script depends on 1.7.0 features
# (`simulator ensure --name`, `run --ready-file`, `run --env`, `simulator teardown --udid
# --force`), so a version older than that is the first thing to check when a run goes red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      advertiser_sim:
        description: 'Simulator name to host the peripheral (empty = resolve from the runner)'
        required: false
        default: ''
      scanner_sim:
        description: 'Simulator name to scan (empty = resolve from the runner)'
        required: false
        default: ''

# Only a pull request's superseded run is cancelled; a push to main queues instead. A
# cancelled run is SIGKILLed after a short grace period — too short for the script's own
# cleanup — which is what the always-run "Reclaim the simulators" step below is for.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sim-to-sim-e2e:
    name: Sim-to-sim E2E (grantiva)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, bleswift]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew on PATH
        # The runner's LaunchAgent does not source a login shell, so grantiva's Homebrew
        # prefix is added explicitly.
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: grantiva version
        run: grantiva --version
      - name: Resolve two simulators
        # Both dispatch inputs given, both are used as-is (they are empty on push and PR).
        # Otherwise two CI-only devices, created on first use by
        # `Scripts/ci/ensure-ci-simulator.sh` from the newest iPhone device type on the
        # highest-version iOS runtime installed, and recreated there when a newer runtime
        # is installed. The runner is also someone's workstation: CI must not
        # borrow "the two newest iPhones" — those are the devices they use — and the reclaim
        # step below tears down every device of these names, which is only safe when the
        # names are CI's own.
        env:
          ADVERTISER_INPUT: ${{ inputs.advertiser_sim }}
          SCANNER_INPUT: ${{ inputs.scanner_sim }}
        run: |
          # Inputs are written into GITHUB_ENV line by line; the dispatch API accepts newlines
          # in an input, so anything but a plain simulator name is refused first. The check is
          # on the whole string (a `case` glob), not per line — `grep -q` would pass a value
          # whose first line is a name and whose second is `PATH=…`.
          for value in "$ADVERTISER_INPUT" "$SCANNER_INPUT"; do
            case "$value" in
              *[!A-Za-z0-9\ ._\(\)-]*)
                echo "::error::simulator inputs may contain only letters, digits, spaces, and . _ ( ) -"
                exit 1
                ;;
            esac
          done
          if [ -n "$ADVERTISER_INPUT" ] && [ -n "$SCANNER_INPUT" ]; then
            if [ "$ADVERTISER_INPUT" = "$SCANNER_INPUT" ]; then
              echo "::error::advertiser_sim and scanner_sim must name two distinct simulators"
              exit 1
            fi
            echo "ADVERTISER_SIM=$ADVERTISER_INPUT" >> "$GITHUB_ENV"
            echo "SCANNER_SIM=$SCANNER_INPUT" >> "$GITHUB_ENV"
            echo "Using $ADVERTISER_INPUT and $SCANNER_INPUT (from the dispatch inputs)"
            exit 0
          fi
          if [ -n "$ADVERTISER_INPUT" ] || [ -n "$SCANNER_INPUT" ]; then
            echo "::error::give both advertiser_sim and scanner_sim, or neither"
            exit 1
          fi
          ADV=$(Scripts/ci/ensure-ci-simulator.sh "BLESwift CI Advertiser")
          SCN=$(Scripts/ci/ensure-ci-simulator.sh "BLESwift CI Scanner")
          echo "ADVERTISER_SIM=BLESwift CI Advertiser" >> "$GITHUB_ENV"
          echo "SCANNER_SIM=BLESwift CI Scanner" >> "$GITHUB_ENV"
          echo "Using BLESwift CI Advertiser ($ADV) and BLESwift CI Scanner ($SCN)"
      - name: Run
        run: Scripts/sim-to-sim-e2e.sh
      - name: Reclaim the simulators
        # Runs on cancellation too. The script's EXIT trap does this on a normal end, but a
        # cancelled step is killed before the trap finishes, and on a persistent runner a
        # simulator still leased by a dead grantiva run fails the next run's `ensure`.
        if: always()
        # `teardown --udid --force` reclaims by live-process inspection — it kills the
        # grantiva runner, the WebDriverAgent xcodebuild and any simctl diagnose holding that
        # device and breaks the lease; it does not shut the simulator down, so `simctl
        # shutdown` follows it. Both run for every device of each name regardless of state (a
        # cancelled run leaves them Booting or Shutting Down as often as Booted; either call on
        # an idle device is harmless). That is only safe because the names are CI's own; a
        # dispatch that named the operator's devices gets them torn down too, which is what
        # the inputs opt into.
        run: |
          for name in "$ADVERTISER_SIM" "$SCANNER_SIM"; do
            [ -n "$name" ] || continue
            for udid in $(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(' '.join(x['udid'] for r in d for x in d[r] if x['name']==sys.argv[1]))" "$name"); do
              grantiva simulator teardown --udid "$udid" --force || true
              xcrun simctl shutdown "$udid" 2>/dev/null || true
            done
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-sim-e2e
          path: .build/e2e-report
