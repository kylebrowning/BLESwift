name: Sim-to-sim E2E

# Two simulator apps use BLE to talk to each other through the virtual radio of bleswift-provider.
# grantiva drives the apps. The test needs no hardware and no entitlements. The workflow runs on
# every push to main and on every pull request from the same repository, on the project's
# self-hosted Mac. This Mac boots two simulators in seconds. The GitHub-hosted image needed 112-577
# s and was not reliable because of the runner's state.
#
# The job's `if:` skips a fork PR. That condition is in this file, and a `pull_request` run uses the
# PR head's copy of the file. See the note at the top of `ci.yml`. Two controls keep a fork off the
# machine: the fork-PR approval policy, and a review of the PR's workflow diff before approval.
# There is no `continue-on-error`. If the job is red, it is red.
#
# grantiva is the version installed on the runner. To move it, run `brew upgrade grantiva` on the
# Mac. The step `grantiva --version` records the version. The script needs these features of version
# 1.7.0:
#   - `simulator ensure --name`
#   - `run --ready-file`
#   - `run --env`
#   - `simulator teardown --udid --force`
# If a run goes red, first check that the version is not older than 1.7.0.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      advertiser_sim:
        description: 'Simulator name to host the peripheral (empty = resolve from the runner)'
        required: false
        default: ''
      scanner_sim:
        description: 'Simulator name to scan (empty = resolve from the runner)'
        required: false
        default: ''

# Only a superseded run of a pull request is cancelled. A push to main waits in a queue. A cancelled
# run receives SIGKILL after a short grace period, which is too short for the script's own cleanup.
# The step "Reclaim the simulators" below always runs for this reason.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sim-to-sim-e2e:
    name: Sim-to-sim E2E (grantiva)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Pinned to the one runner with the label `bleswift-e2e`. The Advertiser and Scanner devices
    # have machine-wide names, and the script tears them down by process inspection. If two E2E runs
    # used two runners on the same Mac, they would kill each other's apps. One runner runs one job
    # at a time.
    runs-on: [self-hosted, macOS, ARM64, bleswift, bleswift-e2e]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew on PATH
        # The runner's LaunchAgent does not load a login shell, so this step adds grantiva's
        # Homebrew prefix to the path.
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: grantiva version
        run: grantiva --version
      - name: Resolve two simulators
        # If both dispatch inputs are set, the job uses them as they are. On push and PR they are
        # empty. Otherwise the job uses two devices only for CI, which
        # `Scripts/ci/ensure-ci-simulator.sh` creates on first use. It uses the newest iPhone device
        # type on the iOS runtime with the highest installed version, and recreates the devices on a
        # newer runtime when one is installed. The runner is also a person's workstation, so CI must
        # not use "the two newest iPhones", which the person uses. The reclaim step below tears down
        # every device with these names, which is only safe if the names belong to CI.
        env:
          ADVERTISER_INPUT: ${{ inputs.advertiser_sim }}
          SCANNER_INPUT: ${{ inputs.scanner_sim }}
        run: |
          # The step writes the inputs into GITHUB_ENV line by line, and the dispatch API accepts
          # newlines in an input. So the step first refuses anything but a plain simulator name. The
          # check is on the whole string (a `case` glob), not on each line, because `grep -q` would
          # accept a value with a name on the first line and `PATH=…` on the second.
          for value in "$ADVERTISER_INPUT" "$SCANNER_INPUT"; do
            case "$value" in
              *[!A-Za-z0-9\ ._\(\)-]*)
                echo "::error::simulator inputs may contain only letters, digits, spaces, and . _ ( ) -"
                exit 1
                ;;
            esac
          done
          if [ -n "$ADVERTISER_INPUT" ] && [ -n "$SCANNER_INPUT" ]; then
            if [ "$ADVERTISER_INPUT" = "$SCANNER_INPUT" ]; then
              echo "::error::advertiser_sim and scanner_sim must name two distinct simulators"
              exit 1
            fi
            echo "ADVERTISER_SIM=$ADVERTISER_INPUT" >> "$GITHUB_ENV"
            echo "SCANNER_SIM=$SCANNER_INPUT" >> "$GITHUB_ENV"
            echo "Using $ADVERTISER_INPUT and $SCANNER_INPUT (from the dispatch inputs)"
            exit 0
          fi
          if [ -n "$ADVERTISER_INPUT" ] || [ -n "$SCANNER_INPUT" ]; then
            echo "::error::give both advertiser_sim and scanner_sim, or neither"
            exit 1
          fi
          ADV=$(Scripts/ci/ensure-ci-simulator.sh "BLESwift CI Advertiser")
          SCN=$(Scripts/ci/ensure-ci-simulator.sh "BLESwift CI Scanner")
          echo "ADVERTISER_SIM=BLESwift CI Advertiser" >> "$GITHUB_ENV"
          echo "SCANNER_SIM=BLESwift CI Scanner" >> "$GITHUB_ENV"
          echo "Using BLESwift CI Advertiser ($ADV) and BLESwift CI Scanner ($SCN)"
      - name: Run
        run: Scripts/sim-to-sim-e2e.sh
      - name: Reclaim the simulators
        # This step also runs after a cancellation. On a normal end, the script's EXIT trap does
        # this work, but a cancelled step is killed before the trap finishes. On a persistent
        # runner, a simulator that a dead grantiva run still leases makes the next run's `ensure`
        # fail.
        if: always()
        # `teardown --udid --force` reclaims a device by inspection of live processes. It kills the
        # grantiva runner, the WebDriverAgent xcodebuild, and any simctl diagnose that holds the
        # device, and it breaks the lease. It does not shut the simulator down, so `simctl shutdown`
        # follows it. Both commands run for every device of each name, in any state, because a
        # cancelled run leaves devices Booting or Shutting Down as often as Booted. Either command
        # is harmless on an idle device. This is only safe because the names belong to CI. If a
        # dispatch names the operator's devices, the job tears them down too. The inputs request
        # this behavior.
        run: |
          for name in "$ADVERTISER_SIM" "$SCANNER_SIM"; do
            [ -n "$name" ] || continue
            for udid in $(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(' '.join(x['udid'] for r in d for x in d[r] if x['name']==sys.argv[1]))" "$name"); do
              grantiva simulator teardown --udid "$udid" --force || true
              xcrun simctl shutdown "$udid" 2>/dev/null || true
            done
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-sim-e2e
          path: .build/e2e-report
