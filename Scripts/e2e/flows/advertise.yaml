# Advertiser side of the two-simulator end-to-end test.
#
# The actual advertising is driven by the app's `--auto-advertise` launch
# argument, so this flow only has to prove the app launched and reached the
# Advertise tab with the peripheral host live. The Explorer has seven tabs, so on
# iPhone the Advertise tab lives inside the system "More" tab.
appId: com.bleswift.explorer
---
- launchApp:
    arguments:
      "--auto-advertise": true
- tapOn: "More"
- tapOn: "Advertise"
# `id` + `text` are ANDed, and `exact: true` anchors the text, so this can only be
# satisfied by the status label in its positive state.
- extendedWaitUntil:
    visible:
      id: "advertise.status"
      text: "Advertising"
      exact: true
    timeout: 20000
