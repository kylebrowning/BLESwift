# Advertiser side of the two-simulator end-to-end test.
#
# The app's `--auto-advertise` launch argument starts the advertising, so this flow only proves two
# things: the app launched, and it reached the Advertise tab with the peripheral host live. The
# Explorer has seven tabs. On an iPhone, the Advertise tab is in the system "More" tab.
appId: com.bleswift.explorer
---
- launchApp:
    arguments:
      "--auto-advertise": true
- tapOn: "More"
- tapOn: "Advertise"
# `id` and `text` are combined with AND, and `exact: true` anchors the text, so only the status
# label in its positive state can satisfy this step.
- extendedWaitUntil:
    visible:
      id: "advertise.status"
      text: "Advertising"
      exact: true
    timeout: 20000
