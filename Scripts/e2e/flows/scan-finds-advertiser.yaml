# Scanner side of the two-simulator end-to-end test. This flow has the main assertion.
#
# The advertiser simulator is already advertising as "BLESwift Explorer Sim" on 180D, through the
# virtual radio of the bleswift-provider on the Mac. This scanner runs a real BLESwift
# `scan(services:)` and must see the advertiser under that name.
#
# The Scan screen is a List. On an iPhone, the scan button and the Discoveries section are below the
# visible area, so the flow must scroll each of them into view before it taps or asserts on it.
appId: com.bleswift.explorer
---
- launchApp
- scrollUntilVisible:
    element:
      id: "scan.startHeartRate"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "scan.startHeartRate"
- scrollUntilVisible:
    element:
      text: "BLESwift Explorer Sim"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "BLESwift Explorer Sim"
      exact: true
    timeout: 30000
